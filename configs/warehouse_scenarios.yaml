      is_dynamic: false
    - id: "wall_3"
      position: {x: 3, y: 0}
      is_dynamic: false
    - id: "wall_4"
      position: {x: 3, y: 9}
      is_dynamic: false
  agents:
    - id: "robot_1"
      position: {x: 0, y: 1}
      goal: {x: 4, y: 1}
      priority: 1
      speed: 1.0
    - id: "robot_2"
      position: {x: 0, y: 8}
      goal: {x: 4, y: 8}
      priority: 1
      speed: 1.0
    - id: "robot_3"
      position: {x: 1, y: 4}
