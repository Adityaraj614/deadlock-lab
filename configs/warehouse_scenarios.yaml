simple_warehouse:
  grid_width: 10
  grid_height: 10
  obstacles:
    - id: "obstacle_1"
      position: {x: 4, y: 4}
      is_dynamic: false
    - id: "obstacle_2"
      position: {x: 5, y: 5}
      is_dynamic: false
  agents:
    - id: "robot_1"
      position: {x: 1, y: 1}
      goal: {x: 8, y: 8}
      priority: 1
      speed: 1.0
    - id: "robot_2"
      position: {x: 1, y: 8}
      goal: {x: 8, y: 1}
      priority: 1
      speed: 1.0
  goals:
    - id: "goal_1"
      position: {x: 8, y: 8}
      assigned_agent_id: "robot_1"
    - id: "goal_2"
      position: {x: 8, y: 1}
      assigned_agent_id: "robot_2"
narrow_corridor:
